
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Detective | Authentication</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: linear-gradient(135deg, #101a35, #172d50, #243d66);
}

.container {
    width: 100%;
    max-width: 430px;
}

.logo {
    text-align: center;
    color: white;
    margin-bottom: 22px;
}

.logo .icon {
    font-size: 48px;
    margin-bottom: 8px;
}

.logo h1 {
    font-size: 28px;
    letter-spacing: 1px;
}

.logo p {
    color: #b7c8e7;
    font-size: 14px;
    margin-top: 6px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.3);
}

.toggle-buttons {
    display: flex;
    background: #edf1f8;
    padding: 5px;
    border-radius: 12px;
    margin-bottom: 25px;
}

.toggle-buttons button {
    width: 50%;
    border: none;
    padding: 12px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    background: transparent;
    color: #60708a;
    transition: .3s;
}

.toggle-buttons button.active {
    background: #244d85;
    color: white;
    box-shadow: 0 3px 10px rgba(36,77,133,.2);
}

.form-title {
    color: #1b2c48;
    font-size: 24px;
    margin-bottom: 7px;
}

.form-subtitle {
    color: #8290a5;
    font-size: 13px;
    margin-bottom: 22px;
}

.input-group {
    margin-bottom: 16px;
}

.input-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #34445f;
    margin-bottom: 7px;
}

.input-group input {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #dce3ee;
    border-radius: 9px;
    outline: none;
    font-size: 14px;
    background: #fafcff;
    transition: .2s;
}

.input-group input:focus {
    border-color: #3777c8;
    box-shadow: 0 0 0 3px rgba(55,119,200,.1);
}

.forgot {
    text-align: right;
    margin-top: -5px;
    margin-bottom: 18px;
}

.forgot a {
    color: #3475bd;
    font-size: 13px;
    text-decoration: none;
    cursor: pointer;
}

.submit-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #244d85;
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: .3s;
}

.submit-btn:hover {
    background: #173967;
    transform: translateY(-1px);
}

.submit-btn:disabled {
    opacity: .65;
    cursor: not-allowed;
}

#message {
    color: #dc2626;
    font-size: 13px;
    text-align: center;
    margin-top: 15px;
    line-height: 1.5;
    min-height: 18px;
}

.footer {
    text-align: center;
    margin-top: 22px;
    color: #91a6c7;
    font-size: 12px;
}

.hidden {
    display: none;
}

@media(max-width:480px) {
    .card {
        padding: 23px;
    }

    .logo h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <div class="icon">🕵️</div>
        <h1>Digital Detective</h1>
        <p>Discover. Investigate. Stay Secure.</p>
    </div>

    <div class="card">

        <!-- LOGIN / SIGNUP TOGGLE -->

        <div class="toggle-buttons">
            <button id="loginTab" class="active"
                type="button" onclick="showLogin()">
                Login
            </button>

            <button id="signupTab"
                type="button" onclick="showSignup()">
                Sign Up
            </button>
        </div>


        <!-- LOGIN FORM -->

        <div id="loginForm">

            <h2 class="form-title">Welcome Back!</h2>

            <p class="form-subtitle">
                Login to continue your investigation.
            </p>

            <form id="loginFormElement">

                <div class="input-group">
                    <label for="loginEmail">Email Address</label>
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="forgot">
                    <a id="forgotPassword">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit"
                    class="submit-btn" id="loginBtn">
                    Login
                </button>

            </form>

        </div>


        <!-- SIGNUP FORM -->

        <div id="signupForm" class="hidden">

            <h2 class="form-title">Create Account</h2>

            <p class="form-subtitle">
                Join Digital Detective today!
            </p>

            <form id="signupFormElement">

                <div class="input-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="signupEmail">Email Address</label>
                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="signupPassword">Password</label>
                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="confirmPassword">
                        Confirm Password
                    </label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit"
                    class="submit-btn" id="signupBtn">
                    Create Account
                </button>

            </form>

        </div>

        <!-- ERROR / SUCCESS MESSAGE -->

        <p id="message" role="status" aria-live="polite"></p>

    </div>

    <div class="footer">
        © 2026 Digital Detective. All Rights Reserved.
    </div>

</div>


<!-- FIREBASE AUTHENTICATION -->

<script type="module">

// Firebase v10.12.2 imports

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getAuth, signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    sendPasswordResetEmail,
    updateProfile }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


// YOUR FIREBASE CONFIGURATION

const firebaseConfig = {
    apiKey: "AIzaSyCMBha3PyRkEKSRCGL9XFy-mtGvOkzXsiA",
    authDomain: "library-397a3.firebaseapp.com",
    projectId: "library-397a3",
    storageBucket: "library-397a3.firebasestorage.app",
    messagingSenderId: "635798649539",
    appId: "1:635798649539:web:c67556ca628be01d388076",
    measurementId: "G-DFYRWVNR36"
};


// INITIALIZE FIREBASE

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


// HTML ELEMENTS

const message = document.getElementById("message");

const loginFormElement =
    document.getElementById("loginFormElement");

const signupFormElement =
    document.getElementById("signupFormElement");

const loginBtn = document.getElementById("loginBtn");
const signupBtn = document.getElementById("signupBtn");


// DISPLAY MESSAGES

function showMessage(text, success = false) {
    message.textContent = text;
    message.style.color = success ? "#15803d" : "#dc2626";
}


// LOGIN / SIGNUP SWITCHING

window.showLogin = function() {

    document.getElementById("loginForm")
        .classList.remove("hidden");

    document.getElementById("signupForm")
        .classList.add("hidden");

    document.getElementById("loginTab")
        .classList.add("active");

    document.getElementById("signupTab")
        .classList.remove("active");

    showMessage("");
};


window.showSignup = function() {

    document.getElementById("signupForm")
        .classList.remove("hidden");

    document.getElementById("loginForm")
        .classList.add("hidden");

    document.getElementById("signupTab")
        .classList.add("active");

    document.getElementById("loginTab")
        .classList.remove("active");

    showMessage("");
};


// FIREBASE ERROR HANDLING

function getErrorMessage(error) {

    switch(error.code) {

        case "auth/invalid-email":
            return "Please enter a valid email address.";

        case "auth/user-not-found":
        case "auth/invalid-credential":
            return "Invalid email or password.";

        case "auth/wrong-password":
            return "Incorrect password.";

        case "auth/email-already-in-use":
            return "This email is already registered.";

        case "auth/weak-password":
            return "Password must be at least 6 characters.";

        case "auth/too-many-requests":
            return "Too many attempts. Please try again later.";

        case "auth/network-request-failed":
            return "Network error. Check your internet connection.";

        case "auth/operation-not-allowed":
            return "Email/Password authentication is not enabled in Firebase.";

        default:
            return error.message || "Something went wrong. Please try again.";
    }
}


// LOGIN FUNCTION

loginFormElement.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    showMessage("");

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        showMessage("Login successful! Redirecting...", true);

        // REDIRECT AFTER SUCCESSFUL LOGIN

        window.location.href = "enrollment.html";

    } catch(error) {

        showMessage(getErrorMessage(error));

    } finally {

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";

    }

});


// SIGNUP FUNCTION

signupFormElement.addEventListener("submit", async (e) => {

    e.preventDefault();

    const fullName =
        document.getElementById("fullName").value.trim();

    const email =
        document.getElementById("signupEmail").value.trim();

    const password =
        document.getElementById("signupPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    showMessage("");


    // CHECK PASSWORD MATCH

    if(password !== confirmPassword) {

        showMessage("Passwords do not match!");
        return;

    }

    if(fullName.length < 2) {

        showMessage("Please enter your full name.");
        return;

    }


    signupBtn.disabled = true;
    signupBtn.textContent = "Creating Account...";


    try {

        // CREATE FIREBASE ACCOUNT

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

        // SAVE FULL NAME TO FIREBASE USER PROFILE

        await updateProfile(userCredential.user, {
            displayName: fullName
        });

        showMessage(
            "Account created successfully! Please login.",
            true
        );

        signupFormElement.reset();

        // SWITCH TO LOGIN

        setTimeout(() => {
            window.showLogin();
        }, 1500);


    } catch(error) {

        showMessage(getErrorMessage(error));

    } finally {

        signupBtn.disabled = false;
        signupBtn.textContent = "Create Account";

    }

});


// FORGOT PASSWORD FUNCTION

document.getElementById("forgotPassword")
.addEventListener("click", async () => {

    const email =
        document.getElementById("loginEmail").value.trim();

    if(!email) {

        showMessage("Please enter your email address first.");
        document.getElementById("loginEmail").focus();
        return;

    }

    try {

        await sendPasswordResetEmail(auth, email);

        showMessage(
            "Password reset email sent! Check your inbox.",
            true
        );

    } catch(error) {

        showMessage(getErrorMessage(error));

    }

});

</script>

</body>
</html>
